[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-synth"
version = "0.1.0"
description = "CLI + Dashboard tool for generating synthetic text classification datasets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

authors = [
  {name = "AutoML-Synth Contributors"},
]

dependencies = [
  "typer[all]",
  "rich",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "httpx",
  "pandas",
  "ddgs",
  "reportlab",
  "platformdirs",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
  "types-requests",
]

[project.urls]
Homepage = "https://github.com/<owner>/automl-synth"

[project.scripts]
automl-synth = "automl_synth.cli:app"

[tool.setuptools.packages.find]
include = ["automl_synth*"]